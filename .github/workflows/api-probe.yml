name: API probe (developer tool)

# Lets a cloud coding session (which can't reach api.tcgdex.net directly) look at live API
# responses. Run it from the Actions tab or the API with a list of TCGdex paths; the
# responses are printed in the job log. It changes nothing in the repository.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated TCGdex paths (e.g. /v2/en/rarities) or full https:// URLs"
        required: true
      max_chars:
        description: "How many characters of each response to print"
        default: "3000"
      jq:
        description: "Optional jq filter applied to each JSON response (prints its output instead of the raw text)"
        default: ""
      grep:
        description: "Optional regex (grep -oE) to pull matching snippets out of each response, e.g. prices from a web page"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          PATHS: ${{ inputs.paths }}
          MAX: ${{ inputs.max_chars }}
          JQ: ${{ inputs.jq }}
          GREP: ${{ inputs.grep }}
        run: |
          set -f  # keep * and ? in paths literal
          for p in $PATHS; do
            case "$p" in /v2/*) url="https://api.tcgdex.net$p";; https://*) url="$p";; *) echo "skipping $p"; continue;; esac
            if [ -n "$GREP" ]; then
              curl -sSL -m 30 -A "Mozilla/5.0" "$url" -o /tmp/out.txt -w '%{url_effective}\n' | sed 's/^/===== /' || true
              tr -s '\n\t ' '   ' < /tmp/out.txt | grep -oE "$GREP" | head -40
              continue
            fi
            if [ -n "$JQ" ]; then
              curl -sS -m 30 "$url" -o /tmp/out.txt || true
              jq -r "$JQ" /tmp/out.txt 2>/dev/null || echo "$p	(no JSON: $(head -c 100 /tmp/out.txt))"
              continue
            fi
            echo "===== $url"
            curl -sS -m 30 -w '\n[HTTP %{http_code}, %{size_download} bytes, %{content_type}]\n' "$url" -o /tmp/out.txt || true
            case "$(file -b --mime-type /tmp/out.txt)" in image/*) echo "(image file)"; continue;; esac
            head -c "$MAX" /tmp/out.txt; echo; tail -c 200 /tmp/out.txt | tail -1
          done

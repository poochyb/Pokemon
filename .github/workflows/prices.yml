name: Update TCGplayer prices

on:
  schedule:
    - cron: "17 21 * * *"   # daily, after TCGCSV's daily refresh
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-prices.mjs
      - name: Commit prices.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update TCGplayer prices"
          git push

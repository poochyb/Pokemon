<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PYB’s Watch Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E4E2DC; --page:#FAF9F6; --ink:#1E2420; --muted:#5E665F; --line:#CFCBC1;
  --cover:#1F3A30; --cover-ink:#F3F1EA; --accent:#2E7D5B; --gold:#A8792A; --up:#2E7D4F; --down:#B2412F;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --gutter:clamp(1rem,4vw,2.5rem);
}
@media (prefers-color-scheme: dark){
  :root{ --desk:#141815; --page:#1D231F; --ink:#E8EBE6; --muted:#9EA8A0; --line:#36403A;
    --cover:#0F1A15; --cover-ink:#E8EBE6; --accent:#5BBE8F; --gold:#D9AE5C; --up:#6CCB8E; --down:#E0715E; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.topbar{position:sticky;top:0;z-index:20;background:var(--cover);color:var(--cover-ink);box-shadow:0 6px 18px rgba(10,14,12,.25)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;padding:.7rem var(--gutter)}
h1{font:800 1.25rem/1 var(--display);margin:0;letter-spacing:-.02em;white-space:nowrap}
.total{margin-left:auto;text-align:right;font-family:var(--display);line-height:1.2}
.total b{font-size:1.25rem;font-weight:800}
.total small{display:block;opacity:.8;font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--page);border-radius:9px;padding:.4rem .85rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.topbar .btn.primary{background:var(--gold);border-color:var(--gold);color:#1E2420}
.btn.danger{color:var(--down)}

main{max-width:1200px;margin:0 auto;padding:1rem var(--gutter) 2rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.toolbar input,.toolbar select{padding:.4rem .6rem;border-radius:9px;border:1px solid var(--line);background:var(--page)}
.toolbar input{flex:1 1 12rem;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin-bottom:1rem}
.kpi{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem}
.kpi span{display:block;color:var(--muted);font-size:.8rem}
.kpi b{font:800 1.25rem/1.2 var(--display)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.9rem}
.watch{background:var(--page);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.watch:hover{border-color:var(--accent)}
.pic{aspect-ratio:1/1;background:var(--desk);display:grid;place-items:center;color:var(--muted);font-size:2.5rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:.6rem .8rem .8rem;display:flex;flex-direction:column;gap:.15rem}
.brand{font:700 .78rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.model{font:700 1.05rem/1.25 var(--display)}
.ref{color:var(--muted);font-size:.85rem}
.val{font:800 1.15rem/1.3 var(--display);margin-top:.25rem}
.chg{font-size:.85rem}
.up{color:var(--up)} .down{color:var(--down)}
.empty{background:var(--page);border:1px dashed var(--line);border-radius:14px;padding:2rem;text-align:center;color:var(--muted)}

footer{max-width:1200px;margin:0 auto;padding:0 var(--gutter) 2rem;display:flex;flex-wrap:wrap;gap:.5rem;color:var(--muted);font-size:.9rem}

dialog{border:0;border-radius:16px;padding:0;background:var(--page);color:var(--ink);width:min(36rem,calc(100vw - 2rem));max-height:calc(100vh - 2rem)}
dialog::backdrop{background:rgba(10,14,12,.55)}
.dlg{padding:1.1rem 1.2rem}
.dlg h2{font:800 1.2rem/1.2 var(--display);margin:0 0 .8rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem}
.form label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:.2rem}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{padding:.4rem .55rem;border-radius:8px;border:1px solid var(--line);background:var(--desk);color:var(--ink);font-size:1rem}
.form textarea{min-height:4rem;resize:vertical}
.photo-row{display:flex;gap:.6rem;align-items:center}
.photo-row img{width:4rem;height:4rem;object-fit:cover;border-radius:8px;background:var(--desk)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;align-items:center}
.actions .spacer{flex:1}
.hist{margin-top:.8rem;font-size:.85rem;color:var(--muted)}
.hist ul{margin:.3rem 0 0;padding-left:1.1rem}
.hint{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}
@media (max-width:520px){ .form{grid-template-columns:1fr} .total{margin-left:0;text-align:left;width:100%} }
</style>
</head>
<body>
<div class="topbar">
  <header>
    <h1>⌚ PYB’s Watch Box</h1>
    <button class="btn primary" id="addBtn">+ Add a watch</button>
    <div class="total" id="total"></div>
  </header>
</div>

<main>
  <div class="kpis" id="kpis"></div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search brand, model, reference…" aria-label="Search">
    <select id="sort" aria-label="Sort">
      <option value="value">Highest value</option>
      <option value="gain">Biggest gain</option>
      <option value="brand">Brand A–Z</option>
      <option value="bought">Recently bought</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <button class="btn" id="exportJson">Save backup file</button>
  <button class="btn" id="importJson">Restore backup…</button>
  <button class="btn" id="exportCsv">Export spreadsheet (CSV)</button>
  <button class="btn" id="importCsv">Import spreadsheet (CSV)…</button>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
</footer>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h2 id="dlgTitle">Add a watch</h2>
    <div class="form">
      <label>Brand<input name="brand" required placeholder="Rolex"></label>
      <label>Model<input name="model" required placeholder="Submariner Date"></label>
      <label>Reference number<input name="ref" placeholder="126610LN"></label>
      <label>Year<input name="year" inputmode="numeric" placeholder="2021"></label>
      <label>Condition<select name="cond"><option>Unworn</option><option>Very good</option><option selected>Good</option><option>Fair</option><option>Poor</option></select></label>
      <label>Box &amp; papers<select name="set"><option>Full set</option><option>Box only</option><option>Papers only</option><option selected>Watch only</option></select></label>
      <label>Price I paid<input name="paid" inputmode="decimal" placeholder="9500"></label>
      <label>Date bought<input name="bought" type="date"></label>
      <label>Current value<input name="value" inputmode="decimal" placeholder="12500"></label>
      <label>Currency<select name="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>CHF</option><option>CAD</option><option>AUD</option><option>JPY</option></select></label>
      <label class="wide">Photo
        <span class="photo-row"><img id="photoPrev" alt="" hidden><input type="file" id="photoFile" accept="image/*"><button type="button" class="btn" id="photoClear" hidden>Remove</button></span>
      </label>
      <label class="wide">Notes<textarea name="notes" placeholder="Serial, service history, where I bought it…"></textarea></label>
    </div>
    <p class="hint" id="c24hint" hidden>Look up today's asking prices: <a id="c24link" target="_blank" rel="noopener">search this reference on Chrono24 ↗</a></p>
    <div class="hist" id="hist"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const KEY = "watchBox.v1";
let state = load();
let editing = null;   // id of the watch open in the dialog, or null when adding
let photo = "";       // photo (small data URL) for the watch in the dialog

function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.watches)) return s; } catch {}
  return { watches: [] };
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch { alert("Your browser is out of storage space. Try smaller photos, or save a backup and remove some photos."); }
}
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : null; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0, 10);
function money(n, cur = "USD"){
  if (n == null) return "—";
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(n); }
  catch { return cur + " " + Math.round(n).toLocaleString(); }
}
const c24 = w => "https://www.chrono24.com/search/index.htm?query=" + encodeURIComponent([w.brand, w.ref || w.model].filter(Boolean).join(" "));

// Totals use the most common currency; watches in other currencies are counted separately.
function mainCurrency(){
  const n = {};
  state.watches.forEach(w => n[w.cur || "USD"] = (n[w.cur || "USD"] || 0) + 1);
  return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || "USD";
}

function render(){
  const cur = mainCurrency();
  const ws = state.watches.filter(w => (w.cur || "USD") === cur);
  const value = ws.reduce((s, w) => s + (w.value ?? w.paid ?? 0), 0);
  const paid = ws.reduce((s, w) => s + (w.paid ?? 0), 0);
  const gain = value - paid;
  const others = state.watches.length - ws.length;
  $("#total").innerHTML = `<b>${money(value, cur)}</b><small>${state.watches.length} watch${state.watches.length === 1 ? "" : "es"}</small>`;
  const top = [...ws].sort((a, b) => (b.value ?? 0) - (a.value ?? 0))[0];
  $("#kpis").innerHTML = state.watches.length ? `
    <div class="kpi"><span>Collection value</span><b>${money(value, cur)}</b></div>
    <div class="kpi"><span>Total paid</span><b>${money(paid, cur)}</b></div>
    <div class="kpi"><span>Gain / loss</span><b class="${gain >= 0 ? "up" : "down"}">${gain >= 0 ? "+" : ""}${money(gain, cur)}${paid ? ` <small>(${(gain / paid * 100).toFixed(1)}%)</small>` : ""}</b></div>
    <div class="kpi"><span>Most valuable</span><b>${top ? esc(top.brand + " " + top.model) : "—"}</b></div>
    ${others ? `<div class="kpi"><span>Not in totals</span><b>${others} in other currencies</b></div>` : ""}` : "";

  const q = $("#search").value.trim().toLowerCase();
  let list = state.watches.filter(w => !q || [w.brand, w.model, w.ref, w.year, w.notes].join(" ").toLowerCase().includes(q));
  const g = w => (w.value ?? 0) - (w.paid ?? w.value ?? 0);
  const sorts = {
    value: (a, b) => (b.value ?? 0) - (a.value ?? 0),
    gain: (a, b) => g(b) - g(a),
    brand: (a, b) => (a.brand + a.model).localeCompare(b.brand + b.model),
    bought: (a, b) => (b.bought || "").localeCompare(a.bought || ""),
  };
  list.sort(sorts[$("#sort").value]);

  $("#grid").innerHTML = list.length ? list.map(w => {
    const d = w.value != null && w.paid ? w.value - w.paid : null;
    return `<button class="watch" data-id="${w.id}">
      <div class="pic">${w.photo ? `<img src="${w.photo}" alt="">` : "⌚"}</div>
      <div class="meta">
        <span class="brand">${esc(w.brand)}</span>
        <span class="model">${esc(w.model)}</span>
        <span class="ref">${esc([w.ref, w.year].filter(Boolean).join(" · "))}</span>
        <span class="val">${money(w.value, w.cur)}</span>
        ${d != null ? `<span class="chg ${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲ +" : "▼ "}${money(d, w.cur)} (${(d / w.paid * 100).toFixed(1)}%) since bought</span>` : ""}
      </div></button>`;
  }).join("") : `<div class="empty" style="grid-column:1/-1">${state.watches.length ? "No watches match your search." : "No watches yet. Click <b>+ Add a watch</b> to start, or import a spreadsheet at the bottom of the page."}</div>`;
}

function openDlg(id){
  editing = id;
  const w = state.watches.find(x => x.id === id) || {};
  const f = $("#form");
  f.reset();
  for (const k of ["brand","model","ref","year","cond","set","paid","bought","value","cur","notes"])
    if (w[k] != null) f.elements[k].value = w[k];
  photo = w.photo || "";
  showPhoto();
  $("#dlgTitle").textContent = id ? "Edit watch" : "Add a watch";
  $("#delBtn").hidden = !id;
  updateC24();
  const h = (w.history || []).slice().reverse();
  $("#hist").innerHTML = h.length > 1 ? `Value history:<ul>${h.map(e => `<li>${e.d}: ${money(e.v, w.cur)}</li>`).join("")}</ul>` : "";
  $("#dlg").showModal();
}
function updateC24(){
  const f = $("#form"), w = { brand: f.elements.brand.value.trim(), ref: f.elements.ref.value.trim(), model: f.elements.model.value.trim() };
  $("#c24hint").hidden = !(w.brand || w.ref || w.model);
  $("#c24link").href = c24(w);
}
function showPhoto(){
  $("#photoPrev").hidden = !photo; $("#photoClear").hidden = !photo;
  if (photo) $("#photoPrev").src = photo;
  $("#photoFile").value = "";
}

// Shrink photos to 600px JPEGs so many fit in browser storage.
function shrink(file){
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = bad;
    img.src = URL.createObjectURL(file);
  });
}

$("#form").addEventListener("submit", e => {
  const f = e.target, el = f.elements;
  const old = state.watches.find(x => x.id === editing);
  const w = old || { id: crypto.randomUUID?.() || String(Date.now()), history: [] };
  Object.assign(w, {
    brand: el.brand.value.trim(), model: el.model.value.trim(), ref: el.ref.value.trim(), year: el.year.value.trim(),
    cond: el.cond.value, set: el.set.value, paid: num(el.paid.value), bought: el.bought.value,
    value: num(el.value.value), cur: el.cur.value, notes: el.notes.value.trim(), photo,
  });
  w.history ||= [];
  const last = w.history[w.history.length - 1];
  if (w.value != null && (!last || last.v !== w.value)) {
    if (last && last.d === today()) last.v = w.value; else w.history.push({ d: today(), v: w.value });
  }
  if (!old) state.watches.push(w);
  save(); render();
});
$("#addBtn").onclick = () => openDlg(null);
$("#cancelBtn").onclick = () => $("#dlg").close();
$("#delBtn").onclick = () => {
  const w = state.watches.find(x => x.id === editing);
  if (w && confirm(`Delete ${w.brand} ${w.model}?`)) {
    state.watches = state.watches.filter(x => x !== w);
    save(); render(); $("#dlg").close();
  }
};
$("#form").elements.brand.addEventListener("input", updateC24);
$("#form").elements.ref.addEventListener("input", updateC24);
$("#form").elements.model.addEventListener("input", updateC24);
$("#photoFile").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try { photo = await shrink(file); } catch { alert("Couldn't read that picture."); }
  showPhoto();
};
$("#photoClear").onclick = () => { photo = ""; showPhoto(); };
$("#grid").addEventListener("click", e => { const b = e.target.closest(".watch"); if (b) openDlg(b.dataset.id); });
$("#search").oninput = render;
$("#sort").onchange = render;

// Backups and spreadsheets
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#exportJson").onclick = () => download(`watch-box-${today()}.json`, JSON.stringify(state, null, 1), "application/json");
$("#importJson").onclick = () => $("#fileJson").click();
$("#fileJson").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    if (!Array.isArray(s.watches)) throw 0;
    if (confirm(`Replace your current ${state.watches.length} watch(es) with the ${s.watches.length} in this backup?`)) { state = s; save(); render(); }
  } catch { alert("That file isn't a Watch Box backup."); }
};

const COLS = ["brand","model","ref","year","cond","set","paid","bought","value","cur","notes"];
const HEAD = ["Brand","Model","Reference","Year","Condition","Box & papers","Price paid","Date bought","Current value","Currency","Notes"];
const csvCell = v => /[",\n]/.test(String(v ?? "")) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? "");
$("#exportCsv").onclick = () => download(`watch-box-${today()}.csv`,
  [HEAD, ...state.watches.map(w => COLS.map(k => w[k]))].map(r => r.map(csvCell).join(",")).join("\n"), "text/csv");

function parseCsv(text){
  const rows = [[]]; let cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";" || c === "\t") { rows[rows.length - 1].push(cell); cell = ""; }
    else if (c === "\n") { rows[rows.length - 1].push(cell.replace(/\r$/, "")); rows.push([]); cell = ""; }
    else cell += c;
  }
  rows[rows.length - 1].push(cell);
  return rows.filter(r => r.some(c => c.trim()));
}
// Recognize common column names, so a spreadsheet you made yourself usually imports as-is.
const ALIAS = {
  brand: /^(brand|make|manufacturer)/, model: /^(model|name|watch)/, ref: /^(ref|reference)/, year: /^(year|production)/,
  cond: /^condition/, set: /^(box|papers|scope)/, paid: /(paid|purchase price|cost|bought for)/, bought: /(date|bought|purchased)/,
  value: /(value|worth|market|estimate)/, cur: /^currency/, notes: /^(notes?|comments?)/,
};
$("#importCsv").onclick = () => $("#fileCsv").click();
$("#fileCsv").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  const rows = parseCsv(await file.text());
  if (rows.length < 2) return alert("That spreadsheet looks empty.");
  const map = {};
  rows[0].forEach((h, i) => {
    const t = h.trim().toLowerCase();
    const k = Object.keys(ALIAS).find(k => !(k in map) && ALIAS[k].test(t));
    if (k) map[k] = i;
  });
  if (!("brand" in map) && !("model" in map)) return alert("Couldn't find a Brand or Model column. Make sure the first row has column names like Brand, Model, Reference, Price paid, Current value.");
  const added = rows.slice(1).map(r => {
    const w = { id: crypto.randomUUID?.() || String(Math.random()), history: [], cur: "USD" };
    for (const k in map) w[k] = (r[map[k]] ?? "").trim();
    w.paid = num(w.paid); w.value = num(w.value);
    if (w.value != null) w.history.push({ d: today(), v: w.value });
    return w;
  }).filter(w => w.brand || w.model);
  if (confirm(`Add ${added.length} watch(es) from this spreadsheet?`)) { state.watches.push(...added); save(); render(); }
};

render();
</script>
</body>
</html>
